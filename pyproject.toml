[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mohh"
version = "0.1.0"
description = "Grammatical-evolution hyper-heuristic that generates multi-objective variation operators"
authors = [
    { name = "Adrian M.", email = "adrian.im0502@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pymoo==0.6.1.5",
    "matplotlib",
    "pandas",
    "tqdm",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mohh"]
