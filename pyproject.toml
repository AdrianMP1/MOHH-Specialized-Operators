[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mohh"
version = "0.1.0"
description = "Grammatical-evolution hyper-heuristic that generates multi-objective variation operators"
authors = [
    { name = "Adrian M.", email = "adrian.im0502@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "pymoo>=0.6.1",
    "matplotlib>=3.9",
    "pandas>=2.3",
    "tqdm>=4.67",
]

[project.scripts]
mohh-generate = "mohh.cli:generate"
mohh-evaluate = "mohh.cli:evaluate"
mohh-run = "mohh.cli:run_full"

[tool.hatch.build.targets.wheel]
packages = ["src/mohh"]
